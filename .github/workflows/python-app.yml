name: Listen during configured weekly windows

on:
  schedule:
    - cron: "*/5 * * * *"  # 固定尝试启动；实际窗口由 LISTEN_WINDOWS 决定
  workflow_dispatch:  # 允许手动触发

# 等待前面任务执行完成
concurrency:
  group: scheduled-task
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 允许推送更改

      - name: Check listening window
        id: window
        run: python3 -m function.listen_window
        env:
            LISTEN_WINDOWS: ${{ secrets.LISTEN_WINDOWS }}

      - name: Set up Python
        if: ${{ steps.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: ${{ steps.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          pip install -r requirements.txt

      - name: Run script
        if: ${{ steps.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch' }}
        run: python -u start.py
        env:
            SESSION: ${{ secrets.SESSION }}
            LISTEN_WINDOWS: ${{ secrets.LISTEN_WINDOWS }}
#            EMAIL_USER: ${{ secrets.EMAIL_USER }}
#            EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
#            TO_EMAIL: ${{ secrets.TO_EMAIL }}
#            EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
#            EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
            AI_KEY: ${{ secrets.AI_KEY }}
            ENNCY_KEY: ${{ secrets.ENNCY_KEY }}
            FILTERED_COURSES: ${{ secrets.FILTERED_COURSES }}


      - name: Commit and push changes
        if: ${{ steps.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto update logs" || echo "No changes to commit"
          git push origin $(git rev-parse --abbrev-ref HEAD)
